name: Deploy YardSquare to Google Cloud Run (Single GCP Project - DEV & PROD Isolated)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Cloud Run Environment to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'yardsquare' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  test:
    name: Run FastAPI, Parcel Border & 3m W3W Grid Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Pytest Suite
        run: python -m pytest -v

  deploy-dev:
    name: Deploy to GCP Cloud Run (DEV - yardsquare-api-dev)
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build & Deploy YardSquare DEV via Cloud Build
        env:
          RAW_PROJECT_ID: ${{ steps.auth.outputs.project_id || secrets.GCP_PROJECT_ID }}
        run: |
          set -o pipefail
          TARGET_PROJECT="${RAW_PROJECT_ID}"
          if [[ "${TARGET_PROJECT}" =~ ^[0-9]+$ ]]; then
            TARGET_PROJECT="$(gcloud projects describe "${TARGET_PROJECT}" --format='value(projectId)')"
          fi
          echo "::notice title=GCP Target Project::Deploying YardSquare DEV to project '${TARGET_PROJECT}'"
          if ! gcloud builds submit --config deploy/cloudbuild.dev.yaml --project "${TARGET_PROJECT}" 2>&1 | tee /tmp/cb.log; then
            ERR_MSG="$(tail -n 12 /tmp/cb.log | tr '\n' ' ')"
            echo "::error title=Cloud Build DEV Failed::${ERR_MSG}"
            exit 1
          fi

  deploy-prod:
    name: Deploy to GCP Cloud Run (PROD - yardsquare-api-prod)
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build & Deploy YardSquare PROD via Cloud Build
        env:
          RAW_PROJECT_ID: ${{ steps.auth.outputs.project_id || secrets.GCP_PROJECT_ID }}
        run: |
          set -o pipefail
          TARGET_PROJECT="${RAW_PROJECT_ID}"
          if [[ "${TARGET_PROJECT}" =~ ^[0-9]+$ ]]; then
            TARGET_PROJECT="$(gcloud projects describe "${TARGET_PROJECT}" --format='value(projectId)')"
          fi
          echo "::notice title=GCP Target Project::Deploying YardSquare PROD to project '${TARGET_PROJECT}'"
          if ! gcloud builds submit --config deploy/cloudbuild.prod.yaml --project "${TARGET_PROJECT}" 2>&1 | tee /tmp/cb.log; then
            ERR_MSG="$(tail -n 12 /tmp/cb.log | tr '\n' ' ')"
            echo "::error title=Cloud Build PROD Failed::${ERR_MSG}"
            exit 1
          fi
